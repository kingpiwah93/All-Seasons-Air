<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | All Seasons Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#060E24;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(12,82,241,0.15),transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(0,212,255,0.1),transparent 50%)}
.content{position:relative;z-index:1;max-width:520px}
.code{font-size:clamp(100px,20vw,180px);font-weight:900;background:linear-gradient(135deg,#0C52F1,#3D7BFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
h1{font-size:28px;font-weight:700;margin:16px 0 12px}
p{font-size:16px;color:rgba(255,255,255,0.6);margin-bottom:36px;font-weight:300;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;border-radius:999px;background:linear-gradient(135deg,#0C52F1,#3D7BFF);color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;text-decoration:none;transition:0.3s;box-shadow:0 8px 28px rgba(12,82,241,0.35)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(12,82,241,0.5)}
.logo{margin-bottom:32px}.logo img{height:44px;margin:0 auto}
</style>
</head>
<body>
<div class="bg"></div>
<div class="content">
    <div class="logo"><img src="ASA_Updated_Logo.svg" alt="All Seasons Air"></div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to comfort.</p>
    <a href="/" class="btn"><i class="fas fa-home"></i> Back to Home</a>
</div>
</body>
</html>
